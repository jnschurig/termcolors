name: Update Homebrew tap (manual)

# Manual re-sync of the Homebrew tap formula to a specific tagged release.
# The automatic per-release update lives in ci.yml's release job (running
# *after* asset upload), to avoid the race where this workflow would have
# read asset URLs before they exist.
#
# Use this only to repair the tap (e.g. assets were re-uploaded after a
# release, or the in-line CI update was skipped). Provide a tag that already
# has all four binary assets attached.
#
# Requires repo secret HOMEBREW_TAP_DEPLOY_KEY: an SSH private key registered
# as a deploy key on jnschurig/homebrew-termcolors with write access enabled.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync (e.g. v0.1.2)'
        required: true

permissions:
  contents: read

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag and version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Never interpolate the input into the script; validate it so the
          # step outputs used below are known-safe.
          tag="$INPUT_TAG"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must look like v1.2.3"
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download release assets and compute sha256
        id: hashes
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          base="https://github.com/${{ github.repository }}/releases/download/${tag}"
          for asset in \
            termcolors-aarch64-macos.tar.gz \
            termcolors-x86_64-macos.tar.gz \
            termcolors-aarch64-linux-musl.tar.gz \
            termcolors-x86_64-linux-musl.tar.gz; do
            # --fail makes curl exit non-zero on 404 so we don't silently
            # hash an HTML "not found" page if an asset is missing.
            curl --fail -sSL -o "$asset" "$base/$asset"
          done
          {
            echo "sha_arm_mac=$(sha256sum termcolors-aarch64-macos.tar.gz       | awk '{print $1}')"
            echo "sha_x86_mac=$(sha256sum termcolors-x86_64-macos.tar.gz        | awk '{print $1}')"
            echo "sha_arm_lin=$(sha256sum termcolors-aarch64-linux-musl.tar.gz  | awk '{print $1}')"
            echo "sha_x86_lin=$(sha256sum termcolors-x86_64-linux-musl.tar.gz   | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Check out tap repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: jnschurig/homebrew-termcolors
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Rewrite formula
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          base="https://github.com/${{ github.repository }}/releases/download/${tag}"
          cat > tap/Formula/termcolors.rb <<RUBY
          class Termcolors < Formula
            desc "Query the running terminal emulator for its current colors via OSC escapes"
            homepage "https://github.com/${{ github.repository }}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/termcolors-aarch64-macos.tar.gz"
                sha256 "${{ steps.hashes.outputs.sha_arm_mac }}"
              end
              on_intel do
                url "${base}/termcolors-x86_64-macos.tar.gz"
                sha256 "${{ steps.hashes.outputs.sha_x86_mac }}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/termcolors-aarch64-linux-musl.tar.gz"
                sha256 "${{ steps.hashes.outputs.sha_arm_lin }}"
              end
              on_intel do
                url "${base}/termcolors-x86_64-linux-musl.tar.gz"
                sha256 "${{ steps.hashes.outputs.sha_x86_lin }}"
              end
            end

            def install
              bin.install "termcolors"
            end

            test do
              assert_match "usage: termcolors", shell_output("#{bin}/termcolors --help 2>&1")
            end
          end
          RUBY

      - name: Commit and push
        run: |
          set -euo pipefail
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git add Formula/termcolors.rb
          git commit -m "termcolors ${{ steps.meta.outputs.version }}"
          git push
