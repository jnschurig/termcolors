name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      run_release:
        description: 'Also run the release job (dry-run, no GitHub Release published)'
        type: boolean
        default: true

# Least privilege by default; the release job opts in to contents: write.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - run: zig fmt --check src/ tests/
      - run: zig build
      - run: zig build test
      - run: zig build test-integration

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_release)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag is written into the Homebrew formula below; refuse anything
      # that isn't a plain vX.Y.Z before building or publishing.
      - name: Validate tag format
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tags must look like v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.1
      - name: Build release binaries
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            zig build release -Dversion="${GITHUB_REF_NAME#v}"
          else
            zig build release
          fi
      - name: Package binaries
        run: |
          cd zig-out/dist
          for triple in */; do
            triple="${triple%/}"
            tar -czf "../../termcolors-${triple}.tar.gz" -C "$triple" .
          done
          cd ../..
          sha256sum termcolors-*.tar.gz > SHA256SUMS
      - name: Upload artifacts (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-binaries-dryrun
          path: |
            termcolors-*.tar.gz
            SHA256SUMS
          retention-days: 7
      # Uses the preinstalled `gh` CLI rather than a third-party action, so
      # no outside code runs with this job's contents: write token.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assets=(termcolors-*.tar.gz SHA256SUMS)
          if gh release view "$tag" >/dev/null 2>&1; then
            # Release already exists (created by hand with notes, or this is
            # a re-run): attach the assets, leave its title and notes alone.
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" --title "$tag" --notes "" --verify-tag
          fi

      # Update the Homebrew tap in the same job, *after* the assets are
      # uploaded. Doing this here (rather than in a separate workflow triggered
      # by `release: published`) avoids a race where the tap-update could read
      # the asset URLs before the upload finishes.
      - name: Compute sha256 for tap formula
        if: startsWith(github.ref, 'refs/tags/v')
        id: hashes
        run: |
          set -euo pipefail
          {
            echo "sha_arm_mac=$(sha256sum termcolors-aarch64-macos.tar.gz       | awk '{print $1}')"
            echo "sha_x86_mac=$(sha256sum termcolors-x86_64-macos.tar.gz        | awk '{print $1}')"
            echo "sha_arm_lin=$(sha256sum termcolors-aarch64-linux-musl.tar.gz  | awk '{print $1}')"
            echo "sha_x86_lin=$(sha256sum termcolors-x86_64-linux-musl.tar.gz   | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Check out tap repo
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jnschurig/homebrew-termcolors
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap

      - name: Rewrite formula and push
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          base="https://github.com/${{ github.repository }}/releases/download/${tag}"
          cat > tap/Formula/termcolors.rb <<RUBY
          class Termcolors < Formula
            desc "Query the running terminal emulator for its current colors via OSC escapes"
            homepage "https://github.com/${{ github.repository }}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/termcolors-aarch64-macos.tar.gz"
                sha256 "${{ steps.hashes.outputs.sha_arm_mac }}"
              end
              on_intel do
                url "${base}/termcolors-x86_64-macos.tar.gz"
                sha256 "${{ steps.hashes.outputs.sha_x86_mac }}"
              end
            end

            on_linux do
              on_arm do
                url "${base}/termcolors-aarch64-linux-musl.tar.gz"
                sha256 "${{ steps.hashes.outputs.sha_arm_lin }}"
              end
              on_intel do
                url "${base}/termcolors-x86_64-linux-musl.tar.gz"
                sha256 "${{ steps.hashes.outputs.sha_x86_lin }}"
              end
            end

            def install
              bin.install "termcolors"
            end

            test do
              assert_match "usage: termcolors", shell_output("#{bin}/termcolors --help 2>&1")
            end
          end
          RUBY
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git add Formula/termcolors.rb
          git commit -m "termcolors ${version}"
          git push
