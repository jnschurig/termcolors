name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      run_release:
        description: 'Also run the release job (dry-run, no GitHub Release published)'
        type: boolean
        default: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check src/ tests/
      - run: zig build
      - run: zig build test
      - run: zig build test-integration

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.run_release)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build release
      - name: Package binaries
        run: |
          cd zig-out/dist
          for triple in */; do
            triple="${triple%/}"
            tar -czf "../../termcolors-${triple}.tar.gz" -C "$triple" .
          done
      - name: Upload artifacts (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-dryrun
          path: termcolors-*.tar.gz
          retention-days: 7
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: termcolors-*.tar.gz
